name: Release

# Builds the distributable release zip (dev/build_release.sh) on a clean
# runner and publishes it to a GitHub Release. Previously this was done
# entirely by hand (build_release.sh run locally, zip uploaded manually) --
# doing it in CI instead means the artifact can't pick up local-tree cruft
# (stray __pycache__, a leftover build/ dir, uncommitted edits) the way a
# laptop checkout can.
#
# Trigger a real release:
#   git tag vX.Y.Z && git push origin vX.Y.Z
#   -> builds the zip and opens a DRAFT GitHub Release with it attached.
#      Nothing goes public until a human reviews the draft (auto-generated
#      notes, not hand-written) and publishes it -- via the GitHub UI or
#      `gh release edit vX.Y.Z --draft=false`.
#
# Dry-run without publishing anything:
#   Run this workflow manually (Actions tab -> Release -> Run workflow).
#   Builds the zip and uploads it as a plain workflow run artifact; skips
#   the GitHub Release step entirely (no tag to attach it to).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release zip
        run: ./dev/build_release.sh --output="MIDI-GPT-for-REAPER-${{ steps.version.outputs.version }}.zip"

      - name: Upload workflow run artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIDI-GPT-for-REAPER-${{ steps.version.outputs.version }}
          path: MIDI-GPT-for-REAPER-${{ steps.version.outputs.version }}.zip

      - name: Open draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            "MIDI-GPT-for-REAPER-${{ steps.version.outputs.version }}.zip" \
            --title "MIDI-GPT for REAPER ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --draft
