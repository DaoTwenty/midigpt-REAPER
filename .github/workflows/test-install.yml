name: Test install.sh / install.ps1

# Runs the installers against real macOS, Linux, and Windows runners:
#   - the pure-Python unit tests (tests/*.py)
#   - the REAPER integration state matrix
#     (tests/integration/test_reaper_states.sh / .ps1), which exercises
#     install.sh --reaper-only / install.ps1 -ReaperOnly against
#     disposable fake REAPER directories covering fresh/partial/
#     pre-configured/REAPER-running/re-run starting states
#   - the full end-to-end install (tests/integration/test_install.sh /
#     .ps1): venv creation, PyTorch, the midigpt[http,inference] backend
#     (from PyPI -- no sibling MIDI-GPT checkout needed here), the REAPER
#     Scripts junction/symlink, and the unit test suite, all against a
#     disposable copy of the repo.
# See those scripts' headers for exactly what each does and doesn't prove.
#
# install.ps1's rewrite (ReaPack/ReaImGui/Arachno/checksum parity with
# install.sh) was authored without a local PowerShell to test against --
# this workflow's windows-latest jobs are the first real verification it
# gets, since GitHub's windows-latest runners ship both powershell.exe
# (5.1, what Install - Windows.bat actually launches) and pwsh (7+).

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "install.ps1"
      - "src/Scripts/MIDI-GPT/**"
      - "tests/**"
      - ".github/workflows/test-install.yml"
  pull_request:
    paths:
      - "install.sh"
      - "install.ps1"
      - "src/Scripts/MIDI-GPT/**"
      - "tests/**"
      - ".github/workflows/test-install.yml"
  workflow_dispatch: {}

jobs:
  reaper-states-unix:
    name: REAPER state matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run REAPER integration state matrix
        run: ./tests/integration/test_reaper_states.sh

  reaper-states-windows:
    name: REAPER state matrix (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run REAPER integration state matrix
        shell: pwsh
        run: .\tests\integration\test_reaper_states.ps1

  full-install-unix:
    name: Full install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full install integration test
        run: ./tests/integration/test_install.sh

  full-install-windows:
    name: Full install (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full install integration test
        shell: pwsh
        run: .\tests\integration\test_install.ps1

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short
